services:
  opencode-solo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: opencode-web-solo:latest
    container_name: opencode-solo-test
    ports:
      - "8081:8080"
    environment:
      - OPERATION_MODE=solo
      - BASE_PATH=/
      - HOME=/home/sgallat
      - XDG_CACHE_HOME=/root/.cache
    volumes:
      - /home/sgallat:/home/sgallat
    restart: unless-stopped
