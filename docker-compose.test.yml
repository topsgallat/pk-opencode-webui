name: opencode-test-local-project

services:
  opencode-test-local:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    image: opencode-web-test-local:latest
    container_name: opencode-test-local
    ports:
      - "8091:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPERATION_MODE=solo
      - API_PORT=4096
      - API_HOSTNAME=127.0.0.1
      - BASE_PATH=/
      - HOME=/home/opencode
      - OPENCODE_WORKSPACE_ROOT=/home/opencode
      - XDG_CACHE_HOME=/home/opencode/.cache
    restart: unless-stopped
    volumes:
      - opencode-data-test:/home/opencode/.local/share/opencode
      - opencode-config-test:/home/opencode/.config/opencode
      - opencode-cache-test:/home/opencode/.cache/opencode

volumes:
  opencode-data-test:
  opencode-config-test:
  opencode-cache-test:
