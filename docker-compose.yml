# =============================================================================
# OpenCode Web UI - Docker Compose
# =============================================================================
# A prefix-aware Web UI for OpenCode that works behind reverse proxies.
#
# Usage:
#   docker compose up              # Basic (no reverse proxy)
#   docker compose -f docker-compose.yml up nginx        # With nginx
#   docker compose -f docker-compose.yml up traefik      # With Traefik
#
# Prerequisites:
#   - OpenCode API server must be running on your host:
#     opencode serve --port 4096
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # OpenCode UI Server (Solo Mode)
  # ---------------------------------------------------------------------------
  # Runs the OpenCode API server and UI together in a single container.
  # OpenCode API is exposed internally at http://127.0.0.1:4096.
  # ---------------------------------------------------------------------------
  opencode-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        - HOST_UID=${UID:-1000}
        - HOST_GID=${GID:-1000}
    container_name: opencode-ui
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - PORT=8080
      - API_PORT=4096
      - API_HOSTNAME=127.0.0.1
      - API_URL=http://127.0.0.1:4096
      - BASE_PATH=/
      - HOME=${HOME}
      - OPENCODE_WORKSPACE_ROOT=${HOME}
    ports:
      - "8080:8080"
    volumes:
      - ${HOME}:${HOME}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Optional: nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: opencode-nginx
    profiles:
      - nginx
    ports:
      - "80:80"
    volumes:
      - ./examples/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      opencode-ui:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Optional: Traefik Reverse Proxy
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: opencode-traefik
    profiles:
      - traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      opencode-ui:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
