services:
  opencode-solo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: opencode-web-solo:latest
    container_name: opencode-solo-test
    ports:
      - "8081:8080"
    environment:
      - OPERATION_MODE=solo
      - BASE_PATH=/
      - HOME=/tmp/opencode-home
      - XDG_CACHE_HOME=/tmp/opencode-home/.cache
    # Run container as non-root for verification (simulate typical non-root image user)
    user: "1000:1000"
    restart: unless-stopped
