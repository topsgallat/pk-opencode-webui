<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>OpenCode</title>
    <!-- Base path will be injected here by server or set statically -->
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      (function() {
        var t = "system";
        try {
          var stored = localStorage.getItem("opencode.theme");
          if (stored === "light" || stored === "dark") {
            t = stored;
          }
        } catch (e) {}
        var prefersDark = typeof window.matchMedia === "function"
          ? window.matchMedia("(prefers-color-scheme: dark)").matches
          : false;
        if (t === "dark" || (t === "system" && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./entry.css" />
    <style>
      /* Minimal loading state before CSS loads */
      .loading-initial {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        color: #6b7280;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      .dark .loading-initial {
        background-color: #18181b;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-initial">Loading...</div>
    </div>
    <script>
      // Fatal-error overlay: must run before the module bundle so failures
      // during module evaluation (old browser APIs, failed chunk loads) are
      // still visible on the device instead of a blank page.
      (function() {
        var shown = 0;
        function show(label, text) {
          if (shown >= 4) return;
          shown++;
          var el = document.createElement("pre");
          el.setAttribute("data-fatal-overlay", label);
          el.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#fff0f0;color:#a00;padding:10px;margin:0;font:12px/1.4 monospace;white-space:pre-wrap;max-height:45vh;overflow:auto;border-top:2px solid #a00";
          el.textContent = "[" + label + "] " + text;
          (document.body || document.documentElement).appendChild(el);
        }
        window.addEventListener("error", function(e) {
          if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
            show("resource", "failed to load " + e.target.tagName + " " + (e.target.src || e.target.href || ""));
          } else {
            show("error", (e.message || String(e.error || "unknown")) + "\n" + (e.filename || "") + ":" + (e.lineno || "?"));
          }
        }, true);
        window.addEventListener("unhandledrejection", function(e) {
          var r = e.reason;
          show("promise", (r && (r.stack || r.message)) || String(r));
        });
      })();
    </script>
    <script>
      // Runtime configuration injection point
      window.__OPENCODE__ = window.__OPENCODE__ || {}
      // Branding config will be injected by the server as a JSON object.
      // Server replacement token: __BRANDING_CONFIG__ -> JSON-safe branding config
      window.__OPENCODE__.branding = __BRANDING_CONFIG__
      window.__OPENCODE__.defaultServerUrl = "__DEFAULT_SERVER_URL__"
    </script>
    <script type="module" src="./entry.js"></script>
  </body>
</html>
