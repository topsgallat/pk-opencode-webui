services:
  opencode-solo:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        - ENABLE_SUDO=1
    image: opencode-web-solo:latest
    container_name: opencode-solo-test
    ports:
      - "8681:8080"
    environment:
      - OPERATION_MODE=solo
      - BASE_PATH=/
      - HOME=/home/sgallat
      - XDG_CACHE_HOME=/home/sgallat/opencode_container/.cache
    volumes:
      - /DATA/AppData/syncthing/data/Ubuntu-24.04:/home/sgallat
      - /DATA/AppData/opencode/opencode_data:/home/sgallat/.local/share/opencode
      - /DATA/AppData/opencode/opencode_cache:/home/sgallat/opencode_container/.cache
      - /DATA/AppData/syncthing/data/opencode-config:/home/sgallat/Syncthing/opencode-config
      - /DATA/AppData/syncthing/data/opencode-config/opencode:/home/sgallat/.config/opencode
    user: "1000:1000"
    restart: unless-stopped
