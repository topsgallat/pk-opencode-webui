<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>OpenCode</title>
    <!-- Base path will be injected here by server or set statically -->
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      (function() {
        var t = "system";
        try {
          var stored = localStorage.getItem("opencode.theme");
          if (stored === "light" || stored === "dark") {
            t = stored;
          }
        } catch (e) {}
        var prefersDark = typeof window.matchMedia === "function"
          ? window.matchMedia("(prefers-color-scheme: dark)").matches
          : false;
        if (t === "dark" || (t === "system" && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./entry.css" />
    <style>
      /* Minimal loading state before CSS loads */
      .loading-initial {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        color: #6b7280;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      .dark .loading-initial {
        background-color: #18181b;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-initial">Loading...</div>
    </div>
    <script>
      // Runtime configuration injection point
      window.__OPENCODE__ = window.__OPENCODE__ || {}
      // Branding config will be injected by the server as a JSON object
      // Server replacement token: __BRANDING_CONFIG__ -> JSON
      window.__OPENCODE__.branding = __BRANDING_CONFIG__
      window.__OPENCODE__.defaultServerUrl = "__DEFAULT_SERVER_URL__"
    </script>
    <script type="module" src="./entry.js"></script>
  </body>
</html>
