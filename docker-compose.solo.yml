services:
  opencode-solo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: opencode-web-solo:latest
    container_name: opencode-solo-test
    ports:
      - "8081:8080"
    environment:
      - OPERATION_MODE=solo
      - API_PORT=4096
      - API_HOSTNAME=127.0.0.1
      - BASE_PATH=/
      - HOME=/home/opencode
      - OPENCODE_WORKSPACE_ROOT=/home/opencode
      - XDG_CACHE_HOME=/home/opencode/.cache
    user: "1000:1000"
    restart: unless-stopped
